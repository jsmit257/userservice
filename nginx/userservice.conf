worker_processes  1;

events {
  worker_connections  1024;
}

http {
    default_type       application/octet-stream;
    include            mime.types;
    gzip               on;
    keepalive_timeout  65;
    sendfile           on;

    server {
        charset      utf-8;
        listen       80;
        root         /www;
        index        login.html
        server_name  localhost;

        location ~ ^/(css|js`)/ {
            # add_header Cache-Control public,max-age=604800;
            # autoindex    on;
        }

        location ~ ^/(address|auth|contact|hc|logout|metrics|otp|user|valid) {
            proxy_pass   http://${US_HTTP_HOST}:${US_HTTP_PORT};
        }
   }
}
